<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 940" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF0F7"/>
      <stop offset="50%" stop-color="#FFF9FC"/>
      <stop offset="100%" stop-color="#F3E8FF"/>
    </linearGradient>

    <radialGradient id="sunGlow" cx="50%" cy="35%" r="55%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="45%" stop-color="#FBCFE8" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#E9D5FF" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="petalWhitePink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="60%" stop-color="#FFF0F7"/>
      <stop offset="100%" stop-color="#F9A8D4"/>
    </linearGradient>

    <linearGradient id="petalBlush" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="45%" stop-color="#FBCFE8"/>
      <stop offset="100%" stop-color="#F472B6"/>
    </linearGradient>

    <linearGradient id="petalLavender" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="55%" stop-color="#F3E8FF"/>
      <stop offset="100%" stop-color="#C084FC"/>
    </linearGradient>

    <linearGradient id="stemGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9D5C8D"/>
      <stop offset="100%" stop-color="#5B2C56"/>
    </linearGradient>

    <linearGradient id="thornVine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C084FC" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#831843" stop-opacity="0.28"/>
    </linearGradient>

    <linearGradient id="goldStamen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Soft Background -->
  <rect width="800" height="940" fill="url(#bgGrad)"/>
  <circle cx="400" cy="340" r="360" fill="url(#sunGlow)"/>

  <!-- Decorative Golden Arch Halo -->
  <path d="M 110 880 L 110 380 A 290 290 0 0 1 690 380 L 690 880" fill="none" stroke="#F472B6" stroke-width="2" stroke-dasharray="6 6" opacity="0.45"/>
  <path d="M 135 880 L 135 385 A 265 265 0 0 1 665 385 L 665 880" fill="none" stroke="#C084FC" stroke-width="1.5" opacity="0.4"/>

  <!-- Subtle Stylized Thorns in the Background (Representing the world that isn't always gentle) -->
  <g stroke="url(#thornVine)" stroke-width="4" fill="none" stroke-linecap="round">
    <path d="M 80 860 Q 210 680 150 470 T 260 150"/>
    <path d="M 710 850 Q 590 660 650 440 T 520 140"/>
    <path d="M 140 760 Q 380 730 670 610"/>
  </g>
  <!-- Small Thorn Points -->
  <g fill="#9D4EDD" opacity="0.24">
    <polygon points="168,610 145,598 164,588"/>
    <polygon points="154,505 178,494 157,484"/>
    <polygon points="195,330 172,318 190,308"/>
    <polygon points="622,590 645,578 625,568"/>
    <polygon points="635,470 612,458 632,448"/>
    <polygon points="598,300 622,288 602,278"/>
  </g>

  <!-- Soft Botanical Leaves -->
  <g opacity="0.85">
    <path d="M 400 840 Q 250 720 180 560 Q 290 590 400 740 Z" fill="url(#petalLavender)"/>
    <path d="M 400 840 Q 560 720 630 550 Q 510 580 400 740 Z" fill="url(#petalBlush)"/>
    <path d="M 400 760 Q 230 620 200 450 Q 320 510 400 670 Z" fill="url(#petalBlush)" opacity="0.8"/>
    <path d="M 400 760 Q 570 620 600 450 Q 480 510 400 670 Z" fill="url(#petalLavender)" opacity="0.8"/>
  </g>

  <!-- Main Lily Stems -->
  <path d="M 400 940 Q 395 700 400 430" stroke="url(#stemGrad)" stroke-width="11" fill="none" stroke-linecap="round"/>
  <path d="M 400 760 Q 310 610 250 470" stroke="url(#stemGrad)" stroke-width="7.5" fill="none" stroke-linecap="round"/>
  <path d="M 400 730 Q 500 590 560 450" stroke="url(#stemGrad)" stroke-width="7.5" fill="none" stroke-linecap="round"/>

  <!-- Left Secondary Blooming Lavender-Pink Lily -->
  <g transform="translate(245, 455) rotate(-24) scale(0.72)">
    <path d="M 0 0 C -65 -80 -55 -195 0 -245 C 55 -195 65 -80 0 0 Z" fill="url(#petalLavender)" stroke="#FFFFFF" stroke-width="3"/>
    <path d="M 0 0 C -65 -80 -55 -195 0 -245 C 55 -195 65 -80 0 0 Z" transform="rotate(58)" fill="url(#petalBlush)" stroke="#FFFFFF" stroke-width="3"/>
    <path d="M 0 0 C -65 -80 -55 -195 0 -245 C 55 -195 65 -80 0 0 Z" transform="rotate(-58)" fill="url(#petalBlush)" stroke="#FFFFFF" stroke-width="3"/>
    <path d="M 0 0 C -60 -65 -45 -155 0 -195 C 45 -155 60 -65 0 0 Z" transform="rotate(28)" fill="url(#petalWhitePink)" stroke="#FFFFFF" stroke-width="2.5"/>
    <path d="M 0 0 C -60 -65 -45 -155 0 -195 C 45 -155 60 -65 0 0 Z" transform="rotate(-28)" fill="url(#petalWhitePink)" stroke="#FFFFFF" stroke-width="2.5"/>
    <path d="M 0 -5 Q -20 -85 -35 -130" stroke="url(#goldStamen)" stroke-width="3.5" fill="none"/>
    <path d="M 0 -5 Q 0 -95 0 -145" stroke="url(#goldStamen)" stroke-width="3.5" fill="none"/>
    <path d="M 0 -5 Q 20 -85 35 -130" stroke="url(#goldStamen)" stroke-width="3.5" fill="none"/>
    <circle cx="-35" cy="-130" r="6" fill="#D97706"/>
    <circle cx="0" cy="-145" r="6" fill="#D97706"/>
    <circle cx="35" cy="-130" r="6" fill="#D97706"/>
  </g>

  <!-- Right Secondary Blooming Rose-Pink Lily -->
  <g transform="translate(565, 440) rotate(24) scale(0.72)">
    <path d="M 0 0 C -65 -80 -55 -195 0 -245 C 55 -195 65 -80 0 0 Z" fill="url(#petalBlush)" stroke="#FFFFFF" stroke-width="3"/>
    <path d="M 0 0 C -65 -80 -55 -195 0 -245 C 55 -195 65 -80 0 0 Z" transform="rotate(58)" fill="url(#petalLavender)" stroke="#FFFFFF" stroke-width="3"/>
    <path d="M 0 0 C -65 -80 -55 -195 0 -245 C 55 -195 65 -80 0 0 Z" transform="rotate(-58)" fill="url(#petalLavender)" stroke="#FFFFFF" stroke-width="3"/>
    <path d="M 0 0 C -60 -65 -45 -155 0 -195 C 45 -155 60 -65 0 0 Z" transform="rotate(28)" fill="url(#petalWhitePink)" stroke="#FFFFFF" stroke-width="2.5"/>
    <path d="M 0 0 C -60 -65 -45 -155 0 -195 C 45 -155 60 -65 0 0 Z" transform="rotate(-28)" fill="url(#petalWhitePink)" stroke="#FFFFFF" stroke-width="2.5"/>
    <path d="M 0 -5 Q -20 -85 -35 -130" stroke="url(#goldStamen)" stroke-width="3.5" fill="none"/>
    <path d="M 0 -5 Q 0 -95 0 -145" stroke="url(#goldStamen)" stroke-width="3.5" fill="none"/>
    <path d="M 0 -5 Q 20 -85 35 -130" stroke="url(#goldStamen)" stroke-width="3.5" fill="none"/>
    <circle cx="-35" cy="-130" r="6" fill="#D97706"/>
    <circle cx="0" cy="-145" r="6" fill="#D97706"/>
    <circle cx="35" cy="-130" r="6" fill="#D97706"/>
  </g>

  <!-- Central Grand White & Blush Lily (A Lily Among the Thorns) -->
  <g transform="translate(400, 420)" filter="url(#softGlow)">
    <!-- Back Petals -->
    <path d="M 0 0 C -85 -105 -75 -245 0 -310 C 75 -245 85 -105 0 0 Z" transform="rotate(-68)" fill="url(#petalLavender)" stroke="#FFFFFF" stroke-width="4"/>
    <path d="M 0 0 C -85 -105 -75 -245 0 -310 C 75 -245 85 -105 0 0 Z" transform="rotate(68)" fill="url(#petalLavender)" stroke="#FFFFFF" stroke-width="4"/>
    <path d="M 0 0 C -85 -105 -75 -245 0 -310 C 75 -245 85 -105 0 0 Z" transform="rotate(132)" fill="url(#petalBlush)" stroke="#FFFFFF" stroke-width="4"/>
    <path d="M 0 0 C -85 -105 -75 -245 0 -310 C 75 -245 85 -105 0 0 Z" transform="rotate(-132)" fill="url(#petalBlush)" stroke="#FFFFFF" stroke-width="4"/>

    <!-- Mid Petals -->
    <path d="M 0 0 C -92 -110 -78 -255 0 -325 C 78 -255 92 -110 0 0 Z" transform="rotate(-34)" fill="url(#petalBlush)" stroke="#FFFFFF" stroke-width="4"/>
    <path d="M 0 0 C -92 -110 -78 -255 0 -325 C 78 -255 92 -110 0 0 Z" transform="rotate(34)" fill="url(#petalBlush)" stroke="#FFFFFF" stroke-width="4"/>

    <!-- Center Focal White-Blush Petals -->
    <path d="M 0 0 C -95 -115 -80 -270 0 -345 C 80 -270 95 -115 0 0 Z" fill="url(#petalWhitePink)" stroke="#FFFFFF" stroke-width="4.5"/>
    <path d="M 0 0 C -75 -95 -65 -195 0 -245 C 65 -195 75 -95 0 0 Z" transform="rotate(180)" fill="url(#petalWhitePink)" stroke="#FFFFFF" stroke-width="4"/>

    <!-- Delicate Lily Veins & Freckles -->
    <path d="M 0 -20 L 0 -265" stroke="#EC4899" stroke-width="2" opacity="0.35"/>
    <path d="M 0 -20 L -95 -200" stroke="#EC4899" stroke-width="2" opacity="0.35"/>
    <path d="M 0 -20 L 95 -200" stroke="#EC4899" stroke-width="2" opacity="0.35"/>

    <g fill="#DB2777" opacity="0.45">
      <circle cx="-18" cy="-85" r="2.5"/><circle cx="16" cy="-95" r="2.5"/><circle cx="-8" cy="-120" r="2.2"/>
      <circle cx="24" cy="-130" r="2"/><circle cx="-28" cy="-115" r="2.5"/><circle cx="6" cy="-70" r="2.5"/>
      <circle cx="-48" cy="-75" r="2.5"/><circle cx="52" cy="-78" r="2.5"/><circle cx="-62" cy="-110" r="2"/>
      <circle cx="64" cy="-112" r="2"/>
    </g>

    <!-- Golden Stamens -->
    <path d="M 0 0 Q -35 -110 -65 -170" stroke="url(#goldStamen)" stroke-width="4.5" fill="none" stroke-linecap="round"/>
    <path d="M 0 0 Q -15 -130 -25 -195" stroke="url(#goldStamen)" stroke-width="4.5" fill="none" stroke-linecap="round"/>
    <path d="M 0 0 Q 0 -140 0 -210" stroke="url(#goldStamen)" stroke-width="5" fill="none" stroke-linecap="round"/>
    <path d="M 0 0 Q 15 -130 25 -195" stroke="url(#goldStamen)" stroke-width="4.5" fill="none" stroke-linecap="round"/>
    <path d="M 0 0 Q 35 -110 65 -170" stroke="url(#goldStamen)" stroke-width="4.5" fill="none" stroke-linecap="round"/>

    <ellipse cx="-65" cy="-170" rx="9" ry="5" transform="rotate(-30 -65 -170)" fill="#D97706"/>
    <ellipse cx="-25" cy="-195" rx="9" ry="5" transform="rotate(-15 -25 -195)" fill="#D97706"/>
    <ellipse cx="0" cy="-210" rx="10" ry="5.5" fill="#B45309"/>
    <ellipse cx="25" cy="-195" rx="9" ry="5" transform="rotate(15 25 -195)" fill="#D97706"/>
    <ellipse cx="65" cy="-170" rx="9" ry="5" transform="rotate(30 65 -170)" fill="#D97706"/>
    <circle cx="0" cy="0" r="14" fill="#FDE68A" stroke="#FFFFFF" stroke-width="3"/>
  </g>

  <!-- Sparkles & Floating Light Particles -->
  <g fill="#EC4899" opacity="0.6">
    <path d="M 180 180 L 185 195 L 200 200 L 185 205 L 180 220 L 175 205 L 160 200 L 175 195 Z"/>
    <path d="M 620 190 L 624 202 L 636 206 L 624 210 L 620 222 L 616 210 L 604 206 L 616 202 Z" fill="#A855F7"/>
    <path d="M 400 35 L 405 50 L 420 55 L 405 60 L 400 75 L 395 60 L 380 55 L 395 50 Z" fill="#D97706" opacity="0.7"/>
    <circle cx="270" cy="130" r="4" fill="#F472B6"/>
    <circle cx="530" cy="125" r="5" fill="#C084FC"/>
    <circle cx="150" cy="390" r="4.5" fill="#F472B6"/>
    <circle cx="650" cy="370" r="4.5" fill="#C084FC"/>
  </g>
</svg>
