<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="crestBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF0F7"/>
      <stop offset="50%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F3E8FF"/>
    </linearGradient>
    <linearGradient id="crestPink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#FBCFE8"/>
      <stop offset="100%" stop-color="#EC4899"/>
    </linearGradient>
    <linearGradient id="crestPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="55%" stop-color="#E9D5FF"/>
      <stop offset="100%" stop-color="#9333EA"/>
    </linearGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EC4899"/>
      <stop offset="50%" stop-color="#D946EF"/>
      <stop offset="100%" stop-color="#9333EA"/>
    </linearGradient>
  </defs>

  <circle cx="200" cy="200" r="192" fill="url(#crestBg)" stroke="url(#ringGrad)" stroke-width="6"/>
  <circle cx="200" cy="200" r="174" fill="none" stroke="#F472B6" stroke-width="1.5" stroke-dasharray="5 5"/>

  <!-- Subtle Cross of Faith Behind the Lily -->
  <g stroke="#E9D5FF" stroke-width="5" stroke-linecap="round">
    <line x1="200" y1="52" x2="200" y2="348"/>
    <line x1="115" y1="135" x2="285" y2="135"/>
  </g>

  <!-- Stylized Thorns Wreath -->
  <path d="M 95 280 A 130 130 0 1 1 305 280" fill="none" stroke="#C084FC" stroke-width="2.5" opacity="0.55"/>

  <!-- Lily Blossom -->
  <g transform="translate(200, 235)">
    <path d="M 0 0 C -45 -55 -40 -130 0 -168 C 40 -130 45 -55 0 0 Z" transform="rotate(-52)" fill="url(#crestPurple)" stroke="#FFFFFF" stroke-width="2.5"/>
    <path d="M 0 0 C -45 -55 -40 -130 0 -168 C 40 -130 45 -55 0 0 Z" transform="rotate(52)" fill="url(#crestPurple)" stroke="#FFFFFF" stroke-width="2.5"/>
    <path d="M 0 0 C -48 -60 -42 -140 0 -178 C 42 -140 48 -60 0 0 Z" transform="rotate(-24)" fill="url(#crestPink)" stroke="#FFFFFF" stroke-width="2.5"/>
    <path d="M 0 0 C -48 -60 -42 -140 0 -178 C 42 -140 48 -60 0 0 Z" transform="rotate(24)" fill="url(#crestPink)" stroke="#FFFFFF" stroke-width="2.5"/>
    <path d="M 0 0 C -50 -65 -44 -148 0 -190 C 44 -148 50 -65 0 0 Z" fill="url(#crestPink)" stroke="#FFFFFF" stroke-width="3"/>

    <!-- Golden Stamens -->
    <path d="M 0 -5 Q -15 -65 -26 -95" stroke="#D97706" stroke-width="2.5" fill="none"/>
    <path d="M 0 -5 Q 0 -75 0 -108" stroke="#D97706" stroke-width="2.8" fill="none"/>
    <path d="M 0 -5 Q 15 -65 26 -95" stroke="#D97706" stroke-width="2.5" fill="none"/>
    <circle cx="-26" cy="-95" r="4" fill="#D97706"/>
    <circle cx="0" cy="-108" r="4.5" fill="#B45309"/>
    <circle cx="26" cy="-95" r="4" fill="#D97706"/>

    <!-- Base Leaves -->
    <path d="M 0 10 Q -55 5 -85 -25 Q -45 35 0 28 Z" fill="url(#crestPurple)"/>
    <path d="M 0 10 Q 55 5 85 -25 Q 45 35 0 28 Z" fill="url(#crestPurple)"/>
    <path d="M 0 10 L 0 85" stroke="#9D5C8D" stroke-width="6" stroke-linecap="round"/>
  </g>
</svg>
